---
-  name: Configure loopback addresses
   hosts: routers
   gather_facts: no

   tasks:
    - name: Add loopback addresses
      cisco.ios.ios_config:
        parents:
           - interface Loopback0
        lines:
             - ip address 100.100.100.{{ inventory_hostname[3:] }} 255.255.255.255


    - name: Show interface
      cisco.ios.ios_command:
          commands:
              - show ip interface brief
      register: output

    - name: Show ip interface brie
      debug:
        msg: "{{ output.stdout_lines[0] }}"
