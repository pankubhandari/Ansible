---
-  name: Adding static route
   hosts: routers
   gather_facts: false

   tasks:
      - name: Static route
        cisco.ios.ios_config:
              lines:
                  - ip route 30.1.1.0 255.255.255.0 10.1.1.4

      - name: Show routing table
        cisco.ios.ios_command:
                commands:
                     - show ip route
        register: output

      - name: Showing output
        debug:
          var: output.stdout_lines
